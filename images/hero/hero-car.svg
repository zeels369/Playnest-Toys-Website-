<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="carBody" x1="100" y1="150" x2="700" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E63950"/>
      <stop offset="60%" stop-color="#C91F37"/>
      <stop offset="100%" stop-color="#961225"/>
    </linearGradient>
    <linearGradient id="windshield" x1="300" y1="140" x2="550" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1B2A5E" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0E1736" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="wheelRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0EDE4"/>
      <stop offset="50%" stop-color="#D5D0C3"/>
      <stop offset="100%" stop-color="#8F8B7F"/>
    </linearGradient>
    <filter id="carShadow" x="50" y="380" width="700" height="100" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="16" />
    </filter>
  </defs>
  <!-- Ground Shadow -->
  <ellipse cx="400" cy="430" rx="330" ry="32" fill="#1B2A5E" fill-opacity="0.22" filter="url(#carShadow)"/>
  
  <!-- Main Car Bodywork -->
  <path d="M120 340 C130 280 200 260 260 260 L320 220 C360 160 480 140 560 150 L630 240 C700 250 740 290 730 350 C720 380 680 390 600 390 L200 390 C150 390 115 370 120 340 Z" fill="url(#carBody)"/>
  
  <!-- Sporty Accents / Highlights -->
  <path d="M130 330 C190 290 280 280 380 285 C500 290 640 270 710 320" stroke="#FFC93C" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <path d="M260 260 L335 185 C370 155 490 140 555 155 L615 245 Z" fill="url(#windshield)"/>
  <path d="M340 180 L545 155" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
  
  <!-- Headlights Glow -->
  <polygon points="120,320 180,310 165,345 115,340" fill="#FFF9D2" />
  <polygon points="120,320 180,310 165,345 115,340" stroke="#FFC93C" stroke-width="2" />
  <circle cx="135" cy="328" r="8" fill="#FFFFFF" />

  <!-- Side Mirror -->
  <path d="M330 215 C330 200 360 200 365 215 Z" fill="#1B2A5E" />
  
  <!-- Seat headrest -->
  <path d="M470 160 C470 135 520 135 520 160 Z" fill="#1B2A5E" />
  
  <!-- Front Wheel Arch & Wheel -->
  <circle cx="230" cy="380" r="68" fill="#1F2433"/>
  <circle cx="230" cy="380" r="48" fill="url(#wheelRim)"/>
  <circle cx="230" cy="380" r="20" fill="#E63950"/>
  <circle cx="230" cy="380" r="8" fill="#FFC93C"/>
  <line x1="230" y1="335" x2="230" y2="425" stroke="#1B2A5E" stroke-width="5"/>
  <line x1="185" y1="380" x2="275" y2="380" stroke="#1B2A5E" stroke-width="5"/>
  
  <!-- Rear Wheel Arch & Wheel -->
  <circle cx="610" cy="380" r="68" fill="#1F2433"/>
  <circle cx="610" cy="380" r="48" fill="url(#wheelRim)"/>
  <circle cx="610" cy="380" r="20" fill="#E63950"/>
  <circle cx="610" cy="380" r="8" fill="#FFC93C"/>
  <line x1="610" y1="335" x2="610" y2="425" stroke="#1B2A5E" stroke-width="5"/>
  <line x1="565" y1="380" x2="655" y2="380" stroke="#1B2A5E" stroke-width="5"/>
  
  <!-- Playnest Badge -->
  <rect x="380" y="320" width="70" height="24" rx="12" fill="#1B2A5E"/>
  <polygon points="412,326 422,332 412,338" fill="#E63950"/>
</svg>